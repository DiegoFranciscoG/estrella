spring:
  application:
    name: estrella-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
  servlet:
    multipart:
      max-file-size: 300KB
      max-request-size: 320KB
  threads:
    virtual:
      enabled: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  # Liveness depends on the API and its database; a slow mail provider must not mark it as down.
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt-secret: ${JWT_SECRET}
  access-token-ttl: 15m
  refresh-token-ttl: 30d
  email-token-ttl: 24h
  public-url: ${APP_PUBLIC_URL}
  cors-origins: ${APP_CORS_ORIGINS}
  cookie-secure: ${APP_COOKIE_SECURE:true}
  cookie-same-site: ${APP_COOKIE_SAME_SITE:Strict}
  mail-from: ${MAIL_FROM}
  # 25 MiB per student by default: with a 0.5 GB free database that is room for about twenty
  # heavy users, and far more in practice (a drawing weighs kilobytes).
  storage-quota-bytes: ${APP_STORAGE_QUOTA_BYTES:26214400}
  sync:
    max-version-bytes: ${APP_SYNC_MAX_VERSION_BYTES:10485760}
    versions-kept: ${APP_SYNC_VERSIONS_KEPT:5}
    max-projects: ${APP_SYNC_MAX_PROJECTS:500}
    uploads-per-minute: ${APP_SYNC_UPLOADS_PER_MINUTE:60}
  privacy-notice-version: "2026-11-06"
  unverified-account-retention: 7d

logging:
  level:
    root: INFO
