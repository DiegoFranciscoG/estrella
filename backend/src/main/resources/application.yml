spring:
  application:
    name: estrella-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
  servlet:
    multipart:
      max-file-size: 300KB
      max-request-size: 320KB
  threads:
    virtual:
      enabled: false

server:
  port: ${PORT:8080}
  # Tomcat reads X-Forwarded-For from the right and trusts only internal proxies (10/8, 172.16/12,
  # 192.168/16, 127/8...): whatever a client writes at the left is ignored, so nobody can pose as
  # another address to escape the per-address limits (OWASP API2 and API4).
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

management:
  # Liveness depends on the API and its database; a slow mail provider must not mark it as down.
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt-secret: ${JWT_SECRET}
  access-token-ttl: 15m
  refresh-token-ttl: 30d
  email-token-ttl: 24h
  public-url: ${APP_PUBLIC_URL}
  cors-origins: ${APP_CORS_ORIGINS}
  cookie-secure: ${APP_COOKIE_SECURE:true}
  cookie-same-site: ${APP_COOKIE_SAME_SITE:Strict}
  mail-from: ${MAIL_FROM}
  # 25 MiB per student by default: with a 0.5 GB free database that is room for about twenty
  # heavy users, and far more in practice (a drawing weighs kilobytes).
  storage-quota-bytes: ${APP_STORAGE_QUOTA_BYTES:26214400}
  sync:
    max-version-bytes: ${APP_SYNC_MAX_VERSION_BYTES:10485760}
    versions-kept: ${APP_SYNC_VERSIONS_KEPT:5}
    max-projects: ${APP_SYNC_MAX_PROJECTS:500}
    uploads-per-minute: ${APP_SYNC_UPLOADS_PER_MINUTE:60}
  # Assistant through each student's own OpenRouter key (OAuth PKCE). The key never reaches the
  # browser: this server stores it encrypted and calls OpenRouter on the student's behalf.
  ai:
    # 32 random bytes in base64, for example: openssl rand -base64 32. No default on purpose.
    key-secret: ${AI_KEY_SECRET}
    base-url: ${APP_AI_BASE_URL:https://openrouter.ai/api/v1}
    auth-url: ${APP_AI_AUTH_URL:https://openrouter.ai/auth}
    # Only ":free" models or the free router: a paid model in this list would be billed to the student.
    models: "${APP_AI_MODELS:google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free,openrouter/free}"
    requests-per-minute: ${APP_AI_REQUESTS_PER_MINUTE:6}
    max-message-chars: ${APP_AI_MAX_MESSAGE_CHARS:4000}
    max-output-tokens: ${APP_AI_MAX_OUTPUT_TOKENS:800}
    timeout: ${APP_AI_TIMEOUT:60s}
  privacy-notice-version: "2026-11-06.2"
  unverified-account-retention: 7d
  # Emails of every kind per hour, all addresses together: a ceiling for the mail provider's quota
  # even if someone spreads requests over many addresses (OWASP API6).
  mail-per-hour: ${APP_MAIL_PER_HOUR:200}
  # Largest JSON body accepted; the biggest legitimate one is an assistant question (about 80 KB).
  max-json-bytes: ${APP_MAX_JSON_BYTES:131072}

logging:
  level:
    root: INFO
