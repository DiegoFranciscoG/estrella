name: estrella

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Local inbox: every email the API sends appears at http://localhost:8025. Not for production.
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (at least 32 bytes)}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Define APP_PUBLIC_URL}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:?Define APP_CORS_ORIGINS}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      APP_COOKIE_SAME_SITE: ${APP_COOKIE_SAME_SITE:-Strict}
      APP_STORAGE_QUOTA_BYTES: ${APP_STORAGE_QUOTA_BYTES:-52428800}
      MAIL_HOST: ${MAIL_HOST:?Define MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:?Define MAIL_FROM}
    mem_limit: 512m
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_APPS_ORIGIN: ${APPS_ORIGIN:?Define APPS_ORIGIN}
    depends_on:
      - api
    environment:
      PANEL_ORIGIN: ${PANEL_ORIGIN:?Define PANEL_ORIGIN}
      APPS_ORIGIN: ${APPS_ORIGIN:?Define APPS_ORIGIN}
    ports:
      # Panel and programs on different sites (localhost vs 127.0.0.1) so each program gets its own process.
      - "127.0.0.1:8088:8080"
      - "127.0.0.1:8089:8081"
    mem_limit: 64m
    restart: unless-stopped

volumes:
  db-data:
