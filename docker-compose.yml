name: estrella

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Local inbox: every email the API sends appears at http://localhost:8025. Not for production.
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  # Local stand-in for OpenRouter: the assistant works here without real accounts or keys.
  # Its authorization page is at http://127.0.0.1:8091/auth. Not for production.
  openrouter-sim:
    build: ./dev/openrouter-sim
    ports:
      - "127.0.0.1:8091:8091"
    mem_limit: 64m
    restart: unless-stopped

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (at least 32 bytes)}
      AI_KEY_SECRET: ${AI_KEY_SECRET:?Define AI_KEY_SECRET (32 random bytes in base64)}
      # Locally the assistant talks to the simulator; production leaves these unset (real OpenRouter).
      APP_AI_BASE_URL: ${APP_AI_BASE_URL:-http://openrouter-sim:8091/api/v1}
      APP_AI_AUTH_URL: ${APP_AI_AUTH_URL:-http://127.0.0.1:8091/auth}
      APP_AI_MODELS: ${APP_AI_MODELS:-google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free,openrouter/free}
      APP_AI_REQUESTS_PER_MINUTE: ${APP_AI_REQUESTS_PER_MINUTE:-6}
      APP_AI_MAX_MESSAGE_CHARS: ${APP_AI_MAX_MESSAGE_CHARS:-4000}
      APP_AI_MAX_OUTPUT_TOKENS: ${APP_AI_MAX_OUTPUT_TOKENS:-800}
      APP_AI_TIMEOUT: ${APP_AI_TIMEOUT:-60s}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Define APP_PUBLIC_URL}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:?Define APP_CORS_ORIGINS}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      APP_COOKIE_SAME_SITE: ${APP_COOKIE_SAME_SITE:-Strict}
      APP_STORAGE_QUOTA_BYTES: ${APP_STORAGE_QUOTA_BYTES:-26214400}
      APP_SYNC_MAX_VERSION_BYTES: ${APP_SYNC_MAX_VERSION_BYTES:-10485760}
      APP_SYNC_VERSIONS_KEPT: ${APP_SYNC_VERSIONS_KEPT:-5}
      APP_SYNC_MAX_PROJECTS: ${APP_SYNC_MAX_PROJECTS:-500}
      APP_SYNC_UPLOADS_PER_MINUTE: ${APP_SYNC_UPLOADS_PER_MINUTE:-60}
      APP_MAIL_PER_HOUR: ${APP_MAIL_PER_HOUR:-200}
      APP_MAX_JSON_BYTES: ${APP_MAX_JSON_BYTES:-131072}
      # Swagger UI at http://localhost:8088/api/docs on this local stack; production leaves it off.
      APP_API_DOCS: ${APP_API_DOCS:-true}
      APP_MAIL_PROVIDER: ${APP_MAIL_PROVIDER:-smtp}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      APP_PROXY_SECRET: ${APP_PROXY_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:?Define MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:?Define MAIL_FROM}
    mem_limit: 512m
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_APPS_ORIGIN: ${APPS_ORIGIN:?Define APPS_ORIGIN}
        # Sign-up screens point to Mailpit: local emails never reach real inboxes.
        VITE_DEV_MAILBOX: http://localhost:8025
    depends_on:
      - api
    environment:
      PANEL_ORIGIN: ${PANEL_ORIGIN:?Define PANEL_ORIGIN}
      APPS_ORIGIN: ${APPS_ORIGIN:?Define APPS_ORIGIN}
    ports:
      # Panel and programs on different sites (localhost vs 127.0.0.1) so each program gets its own process.
      - "127.0.0.1:8088:8080"
      - "127.0.0.1:8089:8081"
    mem_limit: 64m
    restart: unless-stopped

volumes:
  db-data:
