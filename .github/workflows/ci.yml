name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build, unit and integration tests (Testcontainers), coverage gate
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Trademarks only in equivalence data (T-01)
        run: node ../scripts/check-trademarks.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  desktop:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: desktop/windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Windows app tests (navigation policy, official programs, install layout, single file)
        run: dotnet test --project Estrella.Desktop.Tests
      - name: Release build (the real address is set when publishing)
        run: dotnet build Estrella.Desktop -c Release -p:EstrellaUrl=https://estrella.invalid

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Throwaway secrets for this run only
        run: |
          sed -e "s/^POSTGRES_PASSWORD=CAMBIAR/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" \
              -e "s/^JWT_SECRET=CAMBIAR/JWT_SECRET=$(openssl rand -hex 48)/" \
              -e "s|^AI_KEY_SECRET=CAMBIAR|AI_KEY_SECRET=$(openssl rand -base64 32)|" .env.example > .env
      - run: docker compose up --build -d
      - name: Wait for the API
        run: |
          curl -s --retry 60 --retry-delay 2 --retry-all-errors -o /dev/null \
            -X POST http://localhost:8088/api/v1/auth/logout -H 'X-Estrella-Client: web'
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        run: docker compose logs --no-color api web | tail -200

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
