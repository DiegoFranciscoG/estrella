name: Release

# Pushing a version tag (for example v1.0.0) builds ESTRELLA for Windows against the published panel
# and attaches it, with its SHA-256, to a GitHub release. The install page links to the latest one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      # The published panel (docs/despliegue.md). Change it here too if the site's name changes.
      ESTRELLA_URL: https://estrella-panel.netlify.app
      TAG: ${{ github.ref_name }}
    defaults:
      run:
        working-directory: desktop/windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Windows app tests
        run: dotnet test --project Estrella.Desktop.Tests
      - name: Build ESTRELLA.exe for the published panel
        run: dotnet build Estrella.Desktop -c Release "-p:EstrellaUrl=$env:ESTRELLA_URL"
      - name: Checksum
        shell: pwsh
        run: |
          Copy-Item Estrella.Desktop/bin/Release/net48/ESTRELLA.exe "$env:RUNNER_TEMP/ESTRELLA.exe"
          $hash = (Get-FileHash "$env:RUNNER_TEMP/ESTRELLA.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ESTRELLA.exe" | Out-File -Encoding ascii "$env:RUNNER_TEMP/ESTRELLA.exe.sha256"
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:TAG" "$env:RUNNER_TEMP/ESTRELLA.exe" "$env:RUNNER_TEMP/ESTRELLA.exe.sha256" --title "ESTRELLA $env:TAG" --generate-notes --verify-tag
